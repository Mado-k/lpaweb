<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="estilo.css">
    </head>             
<body>
    <!-- Formulário de pesquisa de termos no Google com atributo action para enviar o formulario para o mecanismo de busca do google 7.6 -->
    <form action="https://www.google.com/search" method="get" class="c1">
        <label for="q">Pesquisar:</label>
        <input type="text" id="q" name="q" required>
        <br><br>
        <input type="submit" value="Pesquisar">
    </form>

    <!-- formulário com dois campos de seleção para escolher o dia e o mês de nascimento com botão de envio utilizando atributo method como get 7.7 -->

    <form method="get" class="c1">
        <label for="dia">Dia:</label>
        <input type="number" id="dia" name="dia" min="1" max="31" required>
        <br><br>
        <label for="mes">Mês:</label>
        <input type="number" id="mes" name="mes" min="1" max="12" required>
        <br><br>
        <input type="submit" value="Enviar">
    </form>

    <!-- formulario com caixa de seleção para escolher um país e um campo de texto para o endereço, utilizando o atributo method para definir o http como post 7.8 -->

    <form method="post" class="c1">
        <label for="pais">País:</label>
        <select id="pais" name="pais" required>
            <option value="">Selecione um país</option>
            <option value="brasil">Brasil</option>
            <option value="estados-unidos">Estados Unidos</option>
            <option value="canada">Canadá</option>
        </select>
        <br><br>
        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco" required>
        <br><br>
        <input type="submit" value="Enviar">
    </form>

    <!-- formulario com dois campos de seleção de hora para o horário de inicio e de término de uma reserva em um hotel, com um campo de texto para o nome do hóspede, com method POST e action para enviar à um script PHP 7.9 -->
    <form method="post" action="processar_reserva.php" class="c1">
        <label for="hora_inicio">Hora de Início:</label>
        <input type="time" id="hora_inicio" name="hora_inicio" required>
        <br><br>
        <label for="hora_termino">Hora de Término:</label>
        <input type="time" id="hora_termino" name="hora_termino" required>
        <br><br>
        <label for="nome_hospede">Nome do Hóspede:</label>
        <input type="text" id="nome_hospede" name="nome_hospede" required>
        <br><br>
        <input type="submit" value="Reservar">
    </form>

    <!-- form com campo tipo date para inserir data de nascimento em required 7.10 -->
    <form method="get" class="c1">
        <label for="data_nascimento">Data de Nascimento:</label>
        <input type="date" id="data_nascimento" name="data_nascimento" required>
        <br><br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
