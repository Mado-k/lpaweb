<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>listinhas com estilo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- lista ordenada com estilo -->
    <ol class = "lo1">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>

    <ol id = "lo2">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>

    <!-- lista não ordenada com estilo -->
    <ul class = "ul1">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>   

    <ul id = "ul2">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <!-- lista de definição com estilo -->
    <dl class = "dl1">    
        <dt>Termo 1</dt>
        <dd>lorem ipsum</dd>
        <dt>Termo 2</dt>
        <dd>lorem ipsum</dd>
    </dl>

    <dl>
        <dt>Termo 1</dt>
        <dd>ipsum lorem</dd>
        <dt>Termo 2</dt>
        <dd>lorem ipsum</dd>
    </dl>
</body>
</html>
